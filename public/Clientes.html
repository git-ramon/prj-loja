 <!DOCTYPE html>
    <html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Clientes</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/bootstrap.css">
    </head>
    <body>

        <nav class="navbar">
            <a href="Home.html" class="logo">
                <img src="img/Logo-Prj-Loja.png" alt="Logo">
            </a>

            <div class="nav-links">
                <a href="Home.html">Home</a>
                <a href="Clientes.html">Contato</a>
                <a href="Login.html" id="linkLogin">Login</a>
            </div>
        </nav>

        <main class="formulario">
            <h1>formulário de Contato</h1>
            <p class="descricao">
                Preencha os dados abaixo para entrar em contato.
            </p>
            <form id="formCliente">

                <div class="campo">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" maxlength="80" placeholder="Digite o nome completo"
                        required>
                </div>

                <div class="campo">
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" name="telefone" maxlength="15" placeholder="(61) 99999-9999" autocomplete="tel" 
                    inputmode="numeric" required>
                </div>

                <div class="campo">
                    <label for="mensagem">Mensagem</label>
                    <textarea id="mensagem" name="mensagem" maxlength="120" placeholder="Digite sua mensagem" required></textarea>

                    <div class="contador">
                        <span id="quantidade">0</span>/120 caracteres
                    </div>
                </div>

                <button type="submit">Enviar</button>

                <div id="resultado" role="status" aria-live="polite"></div>

            </form>
        </main>

        <script src="js/script.js"></script>
    </body>
    </html>
