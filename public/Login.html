<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/bootstrap.css">
</head>

<body>

    <nav class="navbar">
        <a href="Home.html" class="logo">
            <img src="img/Logo-Prj-Loja.png" alt="Logo">
        </a>

        <div class="nav-links">
            <a href="Home.html">Home</a>
            <a href="Clientes.html">Contato</a>
            <a href="Login.html" id="linkLogin">Login</a>
        </div>
    </nav>

    <main class="login-container">
        <h1>Área administrativa</h1>
        <p>Acesse para gerenciar os clientes.</p>

        <form id="formLogin">
            <div class="campo">
                <label for="usuario">Usuário</label>
                <input type="text" id="usuario" name="usuario" autocomplete="username" required>
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" autocomplete="current-password" required>
            </div>

            <button type="submit">Entrar</button>

            <p id="mensagemLogin" class="mensagem-login" role="status" aria-live="polite"></p>
        </form>
    </main>


    <script src="js/script.js"></script>

</body>

</html>
