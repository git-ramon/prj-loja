<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área Administrativa</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/bootstrap.css">
</head>

<body>
    <nav class="navbar">
        <a href="Home.html" class="logo">
            <img src="img/Logo-Prj-Loja.png" alt="Logo">
        </a>

        <div class="nav-links">
            <a href="Home.html">Home</a>
            <a href="Clientes.html">Contato</a>
            <a href="Login.html" id="linkLogin">Login</a>
        </div>
    </nav>

    <main class="admin-container">
        <header class="admin-header">
            <div>
                <h1>Área Administrativa</h1>
                <p>Gerenciamento de clientes cadastrados</p>
            </div>

            <button type="button" id="btnSair">Sair</button>
        </header>
        
        <section class="clientes-container">
            <div class="clientes-header">
                <div>
                    <h2>Clientes cadastrados</h2>
                    <p>Consulte e gerencie os registros de clientes.</p>
                </div>

                <div class="clientes-total">
                    <span id="totalClientes">0</span>
                    <span>registros</span>
                </div>
            </div>

            <div class="clientes-toolbar">
                <div class="campo-pesquisa">
                    <label for="pesquisaClientes">Pesquisar clientes</label>
                    <input
                        type="search"
                        id="pesquisaClientes"
                        placeholder="Buscar por nome, telefone ou ID..."
                        autocomplete="off"
                    >
                </div>
            </div>

            <p id="statusClientes" role="status" aria-live="polite">
                Carregando clientes...
            </p>

            <div class="tabela-responsiva">
                <table>
                    <thead>
                        <tr>
                            <th scope="col">ID</th>
                            <th scope="col">Nome</th>
                            <th scope="col">Telefone</th>
                            <th scope="col">Mensagem</th>
                             <th scope="col">Ações</th>
                        </tr>
                    </thead>

                    <tbody id="listaClientes"></tbody>
                </table>
            </div>

            <!-- Paginação da tabela -->
            <div class="d-flex flex-column flex-md-row
                        justify-content-between align-items-center
                        gap-3 mt-3">

                <div id="infoPaginacao" class="text-muted small">
                    Mostrando registros...
                </div>

                <nav aria-label="Navegação da tabela de clientes">
                    <ul class="pagination pagination-sm mb-0"
                        id="paginacaoClientes">
                    </ul>
                </nav>

            </div>

        </section>

    </main>


    
<!-- Modal de edição de cliente -->
<div class="modal fade" id="modalEditarCliente" tabindex="-1"
    aria-labelledby="tituloModalEditar" aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title" id="tituloModalEditar">
                    Editar cliente
                </h5>

                <button type="button" class="btn-close"
                    data-bs-dismiss="modal" aria-label="Fechar">
                </button>
            </div>

            <form id="formEditarCliente">

                <div class="modal-body">

                    <input type="hidden" id="editarId">

                    <div class="mb-3">
                        <label for="editarNome" class="form-label">
                            Nome
                        </label>

                        <input type="text" class="form-control"
                            id="editarNome" maxlength="80" required>
                    </div>

                    <div class="mb-3">
                        <label for="editarTelefone" class="form-label">
                            Telefone
                        </label>

                        <input type="tel" class="form-control"
                            id="editarTelefone" maxlength="15" required>
                    </div>

                    <div class="mb-3">
                        <label for="editarMensagem" class="form-label">
                            Mensagem
                        </label>

                        <textarea class="form-control"
                            id="editarMensagem" maxlength="120"
                            rows="3" required></textarea>
                    </div>

                </div>

                <div class="modal-footer">

                    <button type="button" class="btn btn-secondary"
                        data-bs-dismiss="modal">
                        Cancelar
                    </button>

                    <button type="submit" class="btn btn-primary">
                        Salvar alterações
                    </button>

                </div>

            </form>

        </div>
    </div>
</div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
